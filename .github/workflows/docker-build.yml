name: Backend container build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ vars.REGISTRY_HOST || 'localhost' }}/ar:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t "$IMAGE" .
      - name: Check executable starts
        run: docker run --rm --network none "$IMAGE" --help
      - name: Publish image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY_HOST: ${{ vars.REGISTRY_HOST }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          : "${REGISTRY_HOST:?Set the REGISTRY_HOST repository variable}"
          : "${REGISTRY_USERNAME:?Set the REGISTRY_USERNAME repository secret}"
          : "${REGISTRY_PASSWORD:?Set the REGISTRY_PASSWORD repository secret}"
          printf '%s' "$REGISTRY_PASSWORD" | docker login "$REGISTRY_HOST" --username "$REGISTRY_USERNAME" --password-stdin
          docker push "$IMAGE"
