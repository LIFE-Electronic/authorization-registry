name: Container builds

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ar:ci .
      - name: Check executable starts
        run: docker run --rm --network none ar:ci --help
      - name: Build UI image
        run: docker build -t ar-ui:ci ./ar-frontend
      - name: Check UI server configuration
        run: docker run --rm --network none ar-ui:ci nginx -t
      - name: Publish images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY_HOST: ${{ secrets.REGISTRY_HOST }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          : "${REGISTRY_HOST:?Set the REGISTRY_HOST repository secret}"
          : "${REGISTRY_USERNAME:?Set the REGISTRY_USERNAME repository secret}"
          : "${REGISTRY_PASSWORD:?Set the REGISTRY_PASSWORD repository secret}"
          printf '%s' "$REGISTRY_PASSWORD" | docker login "$REGISTRY_HOST" --username "$REGISTRY_USERNAME" --password-stdin
          for SERVICE in ar ar-ui; do
            IMAGE="$REGISTRY_HOST/$SERVICE"
            docker tag "$SERVICE:ci" "$IMAGE:$GITHUB_SHA"
            docker push "$IMAGE:$GITHUB_SHA"
            docker tag "$SERVICE:ci" "$IMAGE:latest"
            docker push "$IMAGE:latest"
          done
